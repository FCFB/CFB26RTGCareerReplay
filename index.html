<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFB 26 RTG Career Replay Calculator</title>
<style>
:root{--bg:#0a1428;--card:#12203d;--card2:#182a4d;--line:#27407a;--blue:#3b82f6;--text:#fff;--mut:#b8c4dc;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:12px}
header.top{position:sticky;top:0;z-index:5;background:#060d1c;border-bottom:3px solid var(--blue);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header.top h1{font-size:1rem;margin:0;letter-spacing:.5px}
.pill{background:var(--blue);border-radius:99px;padding:3px 12px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
h2{margin:0 0 8px;font-size:1.2rem;color:#fff}h3{margin:14px 0 6px;font-size:1rem;color:#9cc2ff;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
h3 small{color:var(--mut);font-weight:400}
.season{border-left:5px solid var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:3px}
input[type=text],input[type=number],select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0b1730;color:#fff;font-size:1rem}
input.bad{border-color:var(--bad);background:#3a1220}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #1d3263}
.row.head{color:var(--mut);font-size:.8rem;border-bottom:2px solid var(--line)}
.row .c{text-align:center}.row small{display:block;color:var(--mut)}
.flags{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}.flags label{display:flex;gap:8px;align-items:center;color:#fff;margin:0}
.bar{height:12px;background:#0b1730;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:linear-gradient(90deg,#1d4ed8,#60a5fa);width:0;transition:width .25s}
.cat{margin:10px 0}.cat .t{display:flex;justify-content:space-between;margin-bottom:3px}
.big{font-size:2.6rem;font-weight:800;line-height:1}.label{font-size:1.2rem;color:#9cc2ff;font-weight:700}
.status{padding:10px;border-radius:8px;margin:10px 0;font-size:.9rem}
.status.ok{background:#0f3a24;border:1px solid var(--ok)}.status.no{background:#3a2e0f;border:1px solid var(--warn)}
.err{color:var(--bad);font-size:.85rem;min-height:1em}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{padding:10px 16px;border-radius:8px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
button.alt{background:#27407a}button.danger{background:#b91c1c}
.scale{font-size:.85rem;color:var(--mut);columns:2}
@media(max-width:560px){.row{grid-template-columns:1.1fr 1fr 1fr;gap:5px}.big{font-size:2rem}.scale{columns:1}}
@media print{body{background:#fff;color:#000}header.top,.btns{display:none}.card{border:1px solid #888;background:#fff;break-inside:avoid}h2,h3,.label,label,.row small{color:#000}input,select{border:1px solid #888;background:#fff;color:#000}}
</style>
</head>
<body>
<header class="top"><h1>🏈 CFB 26 RTG CAREER REPLAY</h1><span class="pill" id="topScore">0 / 1,000</span></header>
<div class="wrap">

<section class="card" id="setup">
<h2>Setup</h2>
<div class="grid">
<div><label for="pos">Player position</label><select id="pos"><option>QB</option><option>HB</option><option>WR</option><option>MLB</option><option>CB</option></select></div>
<div><label for="Y">Number of college seasons (1–10)</label><input type="number" id="Y" min="1" max="10" step="1" inputmode="numeric"><div class="err" id="Yerr"></div></div>
<div><label for="real">Real player's high-school star rating</label><select id="real"><option value="">Select…</option><option value="1">1 star</option><option value="2">2 stars</option><option value="3">3 stars</option><option value="4">4 stars</option><option value="5">5 stars</option></select></div>
</div>
</section>

<div id="seasons"></div>

<section class="card" id="results">
<h2>Results</h2>
<div class="grid"><div><label for="rtg">RTG player's recruiting star rating</label><select id="rtg"><option value="">Select…</option><option value="1">1 star</option><option value="2">2 stars</option><option value="3">3 stars</option><option value="4">4 stars</option><option value="5">5 stars</option></select></div></div>
<p><span class="big" id="total">0</span> <span style="color:var(--mut)">/ 1,000 maximum</span></p>
<div class="label" id="rating"></div>
<div class="status" id="status"></div>
<div id="cats"></div>
<h3>Rating scale</h3>
<div class="scale">950–1,000 Nearly perfect<br>900–949 Elite recreation<br>800–899 Great recreation<br>700–799 Good recreation<br>600–699 Decent recreation<br>400–599 Below average<br>0–399 Career divergence</div>
<div class="btns"><button id="copy">Copy Score Summary</button><button class="alt" id="print">Print / Save as PDF</button><button class="danger" id="reset">Reset Calculator</button></div>
<div class="err" id="copyMsg" style="color:var(--ok)"></div>
</section>
</div>

<script>
"use strict";
/* ---------- Configuration ---------- */
// Stat tuple: [key, label, weight %, isNegative, isPercentage]
const POS = {
  QB:{aw:"Davey O’Brien Award",stats:[["pyd","Passing yards",25],["ptd","Passing TDs",25],["cmp","Completion %",15,0,1],["int","Interceptions",15,1],["ryd","Rushing yards",10],["rtd","Rushing TDs",5],["fum","Fumbles",5,1]]},
  HB:{aw:"Doak Walker Award",stats:[["ryd","Rushing yards",35],["rtd","Rushing TDs",25],["rec","Receptions",10],["recy","Receiving yards",10],["rectd","Receiving TDs",10],["fum","Fumbles",10,1]]},
  WR:{aw:"Biletnikoff Award",stats:[["rec","Receptions",25],["recy","Receiving yards",30],["rectd","Receiving TDs",30],["drop","Drops",10,1],["fum","Fumbles",5,1]]},
  MLB:{aw:"Butkus Award",stats:[["tkl","Total tackles",30],["tfl","Tackles for loss",20],["sck","Sacks",15],["int","Interceptions",15],["pd","Pass deflections",10],["ff","Forced fumbles",10]]},
  CB:{aw:"Jim Thorpe Award",stats:[["int","Interceptions",30],["pd","Pass deflections",30],["tkl","Total tackles",15],["tfl","Tackles for loss",10],["ff","Forced fumbles",15]]}
};
// Award list: first 4 apply every season; last 2 (All-Freshman) only in season 1.
const awards = () => [["heis","Heisman Trophy"],["nat",POS[S.pos].aw],["aa","First-Team All-American"],["conf","First-Team All-Conference"],["fn","National All-Freshman Team"],["fc","Conference All-Freshman Team"]];
// Team achievements: cfp:true => needs CFP era; ap:true => needs AP Top 25 era
const TEAM = [["bowl","Bowl appearance"],["bowlW","Bowl victory"],["ccA","Conference championship appearance"],["ccW","Conference championship victory"],
  ["cfpA","CFP appearance",1],["cfpW","CFP game victory (won ≥1 CFP game)",1],["ncA","National championship appearance",1],["ncW","National championship victory",1],
  ["ap","Final AP Top 25 ranking",0,1],["w10","10-win season (incl. postseason)"]];
const KEY = "cfb26-rtg-calc-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round(n * 100) / 100;
const fmt = n => String(+r2(n).toFixed(2));
const newSeason = () => ({sc:{real:"",rtg:""},st:{real:{},rtg:{}},aw:{real:{},rtg:{}},tm:{real:{},rtg:{}},cfp:true,ap:true});
const defaults = () => { const s = {pos:"QB",Y:4,real:"",rtg:"",seasons:[]}; while (s.seasons.length < 4) s.seasons.push(newSeason()); return s; };
let S = defaults();

/* ---------- Persistence ---------- */
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (!o) return;
    const d = defaults();
    if (POS[o.pos]) d.pos = o.pos;
    if (Number.isInteger(o.Y) && o.Y >= 1 && o.Y <= 10) d.Y = o.Y;
    if (["1","2","3","4","5"].includes(String(o.real))) d.real = String(o.real);
    if (["1","2","3","4","5"].includes(String(o.rtg))) d.rtg = String(o.rtg);
    d.seasons = [];
    for (let i = 0; i < d.Y; i++) {
      const s = Object.assign(newSeason(), (o.seasons || [])[i] || {});
      s.sc = Object.assign({real:"",rtg:""}, s.sc);
      ["st","aw","tm"].forEach(g => { s[g] = Object.assign({real:{},rtg:{}}, s[g]); });
      d.seasons.push(s);
    }
    S = d;
  } catch(e) { S = defaults(); }
}

/* ---------- Rendering ---------- */
const yrName = i => ["Freshman","Sophomore","Junior","Senior"][i] || "Year " + (i + 1);
function numIn(i,k,w,key,val,pct){
  return `<input type="number" min="0" ${pct?'max="100" step="0.1"':'step="any"'} inputmode="decimal" id="i-${i}-${k}-${w}-${key}" data-i="${i}" data-k="${k}" data-w="${w}" data-key="${key}" value="${esc(val)}">`;
}
function chkIn(i,k,w,key,on){
  return `<input type="checkbox" id="i-${i}-${k}-${w}-${key}" data-i="${i}" data-k="${k}" data-w="${w}" data-key="${key}" ${on?"checked":""}>`;
}
function seasonHTML(s,i){
  const Y = S.Y, P = POS[S.pos];
  const aw = awards().slice(0, i === 0 ? 6 : 4);
  const tm = TEAM.filter(t => !(t[2] && !s.cfp) && !(t[3] && !s.ap));
  const sk = S.pos + "_";
  let h = `<section class="card season"><h2>Season ${i+1} — ${yrName(i)}${i===0?" season":""}</h2>
  <h3>B. College selection <small>${fmt(100/Y)} pts available · <span id="ss-${i}-sel"></span></small></h3>
  <div class="grid"><div><label>Real player's school</label><input type="text" id="i-${i}-sc-real-" data-i="${i}" data-k="sc" data-w="real" value="${esc(s.sc.real)}"></div>
  <div><label>RTG player's school</label><input type="text" id="i-${i}-sc-rtg-" data-i="${i}" data-k="sc" data-w="rtg" value="${esc(s.sc.rtg)}"></div></div>
  <h3>C. Individual stats <small>${fmt(400/Y)} pts available · <span id="ss-${i}-stat"></span></small></h3>
  <div class="row head"><div>Regular season only</div><div class="c">Real</div><div class="c">RTG</div></div>`;
  P.stats.forEach(t => {
    h += `<div class="row"><div>${t[1]}${t[3]?" ↓":""}<small>${t[2]}% · ${fmt(400/Y*t[2]/100)} pts</small></div>
    <div>${numIn(i,"st","real",sk+t[0],s.st.real[sk+t[0]] ?? "",t[4])}</div><div>${numIn(i,"st","rtg",sk+t[0],s.st.rtg[sk+t[0]] ?? "",t[4])}</div></div>`;
  });
  h += `<h3>D. Individual achievements <small>${fmt(200/Y)} pts available · <span id="ss-${i}-ach"></span></small></h3>
  <div class="row head"><div>${fmt(200/Y/aw.length)} pts each</div><div class="c">Real won</div><div class="c">RTG won</div></div>`;
  aw.forEach(a => { h += `<div class="row"><div>${esc(a[1])}</div><div class="c">${chkIn(i,"aw","real",a[0],s.aw.real[a[0]])}</div><div class="c">${chkIn(i,"aw","rtg",a[0],s.aw.rtg[a[0]])}</div></div>`; });
  h += `<h3>E. Team achievements <small>${fmt(200/Y)} pts available · <span id="ss-${i}-team"></span></small></h3>
  <div class="flags"><label>${chkIn(i,"fl","","cfp",s.cfp)} CFP existed this season</label><label>${chkIn(i,"fl","","ap",s.ap)} AP Top 25 existed this season</label></div>
  <div class="row head"><div>${fmt(200/Y/tm.length)} pts each (${tm.length} categories)</div><div class="c">Real team</div><div class="c">RTG team</div></div>`;
  tm.forEach(t => { h += `<div class="row"><div>${t[1]}</div><div class="c">${chkIn(i,"tm","real",t[0],s.tm.real[t[0]])}</div><div class="c">${chkIn(i,"tm","rtg",t[0],s.tm.rtg[t[0]])}</div></div>`; });
  return h + "</section>";
}
function render(){ $("seasons").innerHTML = S.seasons.map(seasonHTML).join(""); calc(); }

/* ---------- Scoring ---------- */
// Parse a numeric entry: returns {m:1} missing, {bad:1} invalid, or {v:number}
function parse(x, max){
  if (x === "" || x == null) return {m:1};
  const n = Number(x);
  if (!isFinite(n) || n < 0 || (max != null && n > max)) return {bad:1};
  return {v:n};
}
// Fraction of a stat's points earned (1, 0.5, or 0) per the 90% / 110% rules
function statFraction(real, rtg, neg){
  if (!neg) {                       // positive stat: higher is better
    if (real === 0) return 1;       // real value 0 -> any nonnegative RTG value is full credit
    if (rtg >= real) return 1;
    return rtg >= 0.9 * real ? 0.5 : 0;
  }
  if (rtg <= real) return 1;        // negative stat: lower is better
  if (real === 0) return 0;         // real had zero -> any higher RTG value earns nothing
  return rtg <= 1.1 * real ? 0.5 : 0;
}
function ratingFor(s){
  return s >= 950 ? "Nearly perfect" : s >= 900 ? "Elite recreation" : s >= 800 ? "Great recreation" : s >= 700 ? "Good recreation" : s >= 600 ? "Decent recreation" : s >= 400 ? "Below average" : "Career divergence";
}
let LAST = null;
function calc(){
  const Y = S.Y, P = POS[S.pos], sk = S.pos + "_";
  const R = {rec:0, sel:0, stat:0, ach:0, team:0}, issues = [];
  document.querySelectorAll("input.bad").forEach(e => e.classList.remove("bad"));
  const star = v => ["1","2","3","4","5"].includes(String(v));
  // A. Recruiting (one-time 100): same = 100, ±1 star = 50, otherwise 0
  if (!star(S.real)) issues.push("Real player's star rating is missing.");
  if (!star(S.rtg)) issues.push("RTG player's star rating is missing (enter it in Results).");
  if (star(S.real) && star(S.rtg)) { const d = Math.abs(S.real - S.rtg); R.rec = d === 0 ? 100 : d === 1 ? 50 : 0; }
  S.seasons.forEach((s,i) => {
    const n = "Season " + (i+1);
    // B. College selection: 100/Y per season if names match (case/space-insensitive)
    const a = s.sc.real.trim().toLowerCase(), b = s.sc.rtg.trim().toLowerCase();
    let sel = 0;
    if (!a) issues.push(`${n}: real player's school is missing.`);
    if (!b) issues.push(`${n}: RTG player's school is missing.`);
    if (a && b && a === b) sel = 100 / Y;
    // C. Individual stats: each stat gets weight% of the season's 400/Y budget
    let st = 0;
    P.stats.forEach(t => {
      const k = sk + t[0], max = t[4] ? 100 : null;
      const a2 = parse(s.st.real[k], max), b2 = parse(s.st.rtg[k], max);
      [[a2,"real","Real"],[b2,"rtg","RTG"]].forEach(([p,w,nm]) => {
        if (p.m) issues.push(`${n}: ${nm} ${t[1]} is missing.`);
        if (p.bad) { issues.push(`${n}: ${nm} ${t[1]} is invalid (must be a number ≥ 0${max?" and ≤ 100":""}).`); const el = $(`i-${i}-st-${w}-${k}`); if (el) el.classList.add("bad"); }
      });
      if (a2.v == null || b2.v == null) return;   // missing/invalid entries never earn points
      st += 400 / Y * t[2] / 100 * statFraction(a2.v, b2.v, !!t[3]);
    });
    // D. Achievements: budget 200/Y split by 6 (freshman) or 4 (later); matching outcome = full points
    const aw = awards().slice(0, i === 0 ? 6 : 4);
    let ach = 0;
    aw.forEach(x => { if (!!s.aw.real[x[0]] === !!s.aw.rtg[x[0]]) ach += 200 / Y / aw.length; });
    // E. Team: budget 200/Y split equally among historically applicable categories
    const tm = TEAM.filter(t => !(t[2] && !s.cfp) && !(t[3] && !s.ap));
    let team = 0;
    tm.forEach(x => { if (!!s.tm.real[x[0]] === !!s.tm.rtg[x[0]]) team += 200 / Y / tm.length; });
    R.sel += sel; R.stat += st; R.ach += ach; R.team += team;
    const set = (id, v, m) => { const e = $(`ss-${i}-${id}`); if (e) e.textContent = fmt(v) + " earned"; };
    set("sel", sel); set("stat", st); set("ach", ach); set("team", team);
  });
  const caps = {rec:100, sel:100, stat:400, ach:200, team:200};
  Object.keys(R) .forEach(k => { R[k] = Math.min(caps[k], Math.max(0, r2(R[k]))); if (!isFinite(R[k])) R[k] = 0; });
  const total = Math.min(1000, r2(R.rec + R.sel + R.stat + R.ach + R.team));
  const done = issues.length === 0, label = ratingFor(Math.round(total * 10) / 10);
  const names = {rec:"A. Recruiting", sel:"B. College selection", stat:"C. Individual stats", ach:"D. Individual achievements", team:"E. Team achievements"};
  $("cats").innerHTML = Object.keys(R).map(k => `<div class="cat"><div class="t"><span>${names[k]}</span><b>${fmt(R[k])} / ${caps[k]}</b></div><div class="bar"><div style="width:${R[k]/caps[k]*100}%"></div></div></div>`).join("") +
    `<div class="cat"><div class="t"><span><b>Total</b></span><b>${fmt(total)} / 1,000</b></div><div class="bar"><div style="width:${total/10}%"></div></div></div>`;
  $("total").textContent = fmt(total);
  $("topScore").textContent = fmt(total) + " / 1,000";
  $("rating").textContent = (done ? "" : "Provisional: ") + label;
  const st = $("status");
  st.className = "status " + (done ? "ok" : "no");
  st.innerHTML = done ? "✅ Complete: all required star ratings, schools and stats are entered and valid."
    : `⚠️ Incomplete: ${issues.length} required ${issues.length===1?"entry is":"entries are"} missing or invalid. Missing stats earn 0 points until filled.<ul>${issues.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${issues.length>8?`…and ${issues.length-8} more.`:""}`;
  LAST = {R, total, label, done};
}

/* ---------- Events ---------- */
function resize(){ while (S.seasons.length < S.Y) S.seasons.push(newSeason()); S.seasons.length = S.Y; }
function onEv(e){
  const t = e.target;
  if (t.id === "pos") { S.pos = t.value; save(); render(); return; }
  if (t.id === "real" || t.id === "rtg") { S[t.id] = t.value; save(); calc(); return; }
  if (t.id === "Y") {
    const n = Number(t.value);
    if (t.value !== "" && Number.isInteger(n) && n >= 1 && n <= 10) { $("Yerr").textContent = ""; S.Y = n; resize(); save(); render(); }
    else { $("Yerr").textContent = "Enter a whole number from 1 to 10."; }
    if (e.type === "change" && $("Yerr").textContent) { t.value = S.Y; $("Yerr").textContent = ""; }
    return;
  }
  if (t.dataset.i === undefined) return;
  const s = S.seasons[+t.dataset.i], k = t.dataset.k, w = t.dataset.w, key = t.dataset.key;
  if (k === "sc") s.sc[w] = t.value;
  else if (k === "st") s.st[w][key] = t.value;
  else if (k === "aw" || k === "tm") s[k][w][key] = t.checked;
  else if (k === "fl") { if (e.type !== "change") return; s[key] = t.checked; save(); render(); return; }
  save(); calc();
}
document.addEventListener("input", onEv);
document.addEventListener("change", onEv);

$("print").onclick = () => window.print();
$("reset").onclick = () => {
  if (!confirm("Reset the calculator? This clears ALL entries and saved data.")) return;
  try { localStorage.removeItem(KEY); } catch(e){}
  S = defaults(); init();
};
$("copy").onclick = () => {
  const c = LAST, L = [
    "CFB 26 RTG Career Replay Score", "Position: " + S.pos, "College seasons: " + S.Y,
    "Real player star rating: " + (S.real || "not entered"), "RTG player star rating: " + (S.rtg || "not entered"),
    "Recruiting: " + fmt(c.R.rec) + " / 100", "College selection: " + fmt(c.R.sel) + " / 100",
    "Individual stats: " + fmt(c.R.stat) + " / 400", "Individual achievements: " + fmt(c.R.ach) + " / 200",
    "Team achievements: " + fmt(c.R.team) + " / 200", "Final score: " + fmt(c.total) + " / 1,000",
    "Rating: " + c.label + (c.done ? "" : " (provisional: inputs incomplete)")].join("\n");
  const ok = () => { $("copyMsg").textContent = "Copied to clipboard!"; setTimeout(() => $("copyMsg").textContent = "", 2500); };
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = L; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch(e) { prompt("Copy this summary:", L); } ta.remove(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(L).then(ok, fallback); else fallback();
};

function init(){
  $("pos").value = S.pos; $("Y").value = S.Y; $("real").value = S.real; $("rtg").value = S.rtg; $("Yerr").textContent = "";
  render();
}
load(); init();
</script>
</body>
</html>
